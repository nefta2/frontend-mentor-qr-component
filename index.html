<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- displays site properly based on user's device -->
		<link href="./src/output.css" rel="stylesheet" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="./images/favicon-32x32.png"
		/>

		<title>Frontend Mentor | QR code component</title>
	</head>
	<body class="font-outfit bg-slate-300">
		<div
			class="flex flex-col gap-6 max-w-[320px] mx-auto mt-[230.50px] bg-white rounded-[20px] p-qr-card shadow-[0_25px_25px_rgba(0,0,0,0.0477)]"
		>
			<img
				src="./images/image-qr-code.png"
				alt="QR Code"
				class="rounded-[10px]"
			/>
			<div class="flex flex-col gap-4 px-4">
				<h1
					class="text-[22px] text-center text-slate-900 font-bold tracking-normal leading-[120%]"
				>
					Improve your front-end skills by building projects
				</h1>
				<p
					class="text-[15px] text-center text-slate-500 font-[400] tracking-[0.2px] leading-[140%]"
				>
					Scan the QR code to visit Frontend Mentor and take your coding skills
					to the next level
				</p>
			</div>
		</div>
	</body>
</html>
